name: Test & Build

on: [push, pull_request]

concurrency:
  group: test-build-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.module }} Tests (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        module: [Api, Core]

    # Run on all pushes. For pull requests, run only for external forks,
    # because internal pull requests are already tested by their branch push.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Disable network offload
        run: sudo ethtool -K eth0 tx off rx off

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Apt Packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxmlsec1-dev libxml2-dev

      - name: Install Poetry
        uses: ./.github/actions/poetry

      - name: Install Tox
        run: poetry install --only ci
        env:
          POETRY_VIRTUALENVS_CREATE: false

      - name: Run Tests
        run: tox
        env:
          TOX_DOCKER_GATEWAY: "0.0.0.0"
          MODULE: ${{ matrix.module }}

  test-migrations:
    name: Migration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Disable network offload
        run: sudo ethtool -K eth0 tx off rx off

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Apt Packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxmlsec1-dev libxml2-dev

      - name: Install Poetry
        uses: ./.github/actions/poetry

      - name: Install Tox
        run: poetry install --only ci
        env:
          POETRY_VIRTUALENVS_CREATE: false

      - name: Run Migration Tests
        run: tox -e "migration-docker"
        env:
          TOX_DOCKER_GATEWAY: "0.0.0.0"

  prepare-base-image:
    name: Prepare base image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      baseimage: ${{ steps.baseimage.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Disable network offload
        run: sudo ethtool -K eth0 tx off rx off

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate tags for base image
        id: baseimage-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ekirjasto-circ-baseimage
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Generate tag for latest
        id: baseimage-latest
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ekirjasto-circ-baseimage
          tags: |
            type=raw,value=latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if base image was changed by this branch
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            baseimage:
              - 'docker/Dockerfile.baseimage'

      - name: Check if branch base image tag exists
        id: tag-check
        shell: bash
        run: |
          set -euo pipefail

          branch_tag="${{ fromJSON(steps.baseimage-meta.outputs.json).tags[0] }}"

          if docker buildx imagetools inspect \
            "${branch_tag}" >/dev/null 2>&1
          then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push base image
        if: >-
          steps.tag-check.outputs.exists == 'false' ||
          steps.changes.outputs.baseimage == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.baseimage
          target: baseimage
          cache-from: |
            type=registry,ref=${{ fromJSON(steps.baseimage-meta.outputs.json).tags[0] }}
            type=registry,ref=${{ fromJSON(steps.baseimage-latest.outputs.json).tags[0] }}
          cache-to: type=inline
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.baseimage-meta.outputs.tags }}
          labels: ${{ steps.baseimage-meta.outputs.labels }}
          push: true

      - name: Set base image tag
        id: baseimage
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ fromJSON(steps.baseimage-meta.outputs.json).tags[0] }}"
          echo "Base image tag: ${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  docker-test-migrations:
    name: Docker migration test
    runs-on: ubuntu-latest
    needs: [prepare-base-image]
    permissions:
      contents: read

    # On pull requests, prepare-base-image is skipped. In that case,
    # docker-compose.yml falls back to the latest base image.
    if: >-
      always() &&
      needs.prepare-base-image.result != 'failure' &&
      (
        github.event_name == 'push' ||
        github.event.pull_request.head.repo.full_name != github.repository
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Disable network offload
        run: sudo ethtool -K eth0 tx off rx off

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Test migrations
        run: ./docker/ci/test_migrations.sh
        env:
          BUILD_BASE_IMAGE: ${{ needs.prepare-base-image.outputs.baseimage }}

  docker-build-and-test:
    name: Docker build & test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [prepare-base-image]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Disable network offload
        run: sudo ethtool -K eth0 tx off rx off

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        run: docker compose build webapp scripts os
        env:
          BUILD_BASE_IMAGE: ${{ needs.prepare-base-image.outputs.baseimage }}
          BUILD_CACHE_FROM: ""

      - name: Start container stack
        run: docker compose up --no-build -d
        env:
          BUILD_BASE_IMAGE: ${{ needs.prepare-base-image.outputs.baseimage }}

      - name: Run webapp tests
        run: ./docker/ci/test_webapp.sh webapp

      - name: Run scripts tests
        run: ./docker/ci/test_scripts.sh scripts

      - name: Output logs on failure
        if: failure()
        run: |
          docker logs circulation-webapp-1 || true
          docker logs circulation-scripts-1 || true

      - name: Stop containers
        if: always()
        run: docker compose down

  docker-image-push:
    name: Push ekirjasto-circ-${{ matrix.image }}
    runs-on: ubuntu-latest
    needs:
      - test
      - test-migrations
      - docker-test-migrations
      - docker-build-and-test
      - prepare-base-image

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - scripts
          - webapp
          - exec

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Disable network offload
        run: sudo ethtool -K eth0 tx off rx off

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: ./.github/actions/poetry

      - name: Set up Dunamai
        run: poetry install --only ci
        env:
          POETRY_VIRTUALENVS_CREATE: false

      - name: Create version file
        shell: bash
        run: |
          set -euo pipefail

          echo \
            "__version__ = '$(dunamai from git --style semver)'" \
            >> core/_version.py

          echo \
            "__commit__ = '$(dunamai from git --format {commit} --full-commit)'" \
            >> core/_version.py

          echo \
            "__branch__ = '$(dunamai from git --format {branch})'" \
            >> core/_version.py

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags for image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ekirjasto-circ-${{ matrix.image }}
          tags: |
            type=semver,pattern={{major}}.{{minor}},priority=10
            type=semver,pattern={{version}},priority=20
            type=ref,event=branch,priority=30
            type=sha,priority=40

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: ${{ matrix.image }}
          cache-from: |
            type=registry,ref=${{ needs.prepare-base-image.outputs.baseimage }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE=${{ needs.prepare-base-image.outputs.baseimage }}

  mark-released:
    name: Mark PRs as released
    needs: [docker-image-push]
    runs-on: ubuntu-latest

    # Only version-tag pushes mark PRs as released.
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.docker-image-push.result == 'success'

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z. Got: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Create released label if needed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh label list \
            --limit 1000 \
            --json name \
            --jq '.[].name' |
            grep -Fxq "released"
          then
            echo "Creating label released"

            gh label create "released" \
              --color "0E8A16" \
              --description "Included in a published release"
          fi

      - name: Mark release PRs as released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          RELEASE_LABEL="release:${RELEASE_TAG}"

          gh pr list \
            --state merged \
            --label "${RELEASE_LABEL}" \
            --limit 100 \
            --json number,title \
            --jq '
              .[]
              | [.number, .title]
              | @tsv
            ' \
            > released-prs.txt

          if [[ ! -s released-prs.txt ]]; then
            echo "No PRs found with label ${RELEASE_LABEL}" >&2
            exit 1
          fi

          while IFS=$'\t' read -r pr title
          do
            echo "Marking PR #${pr} as released: ${title}"

            gh pr edit "${pr}" \
              --add-label "released"
          done < released-prs.txt
