name: Create release branch

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name, esim. v1.5.0"
        required: true
        type: string
      base_tag:
        description: "Nykyinen tuotantotagi, esim. v1.4.0"
        required: true
        type: string

  workflow_call:
    inputs:
      release_name:
        description: "Release name, esim. v1.5.0"
        required: true
        type: string
      base_tag:
        description: "Nykyinen tuotantotagi, esim. v1.4.0"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release:
    name: Create release branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release inputs
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          BASE_TAG: ${{ inputs.base_tag }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release name must match vX.Y.Z. Got: ${RELEASE_NAME}" >&2
            exit 1
          fi

          if [[ ! "${BASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Base tag must match vX.Y.Z. Got: ${BASE_TAG}" >&2
            exit 1
          fi

          if [[ "${RELEASE_NAME}" == "${BASE_TAG}" ]]; then
            echo "Release name and base tag must be different" >&2
            exit 1
          fi

          if ! git rev-parse \
            "refs/tags/${BASE_TAG}^{commit}" >/dev/null 2>&1
          then
            echo "Base tag does not exist: ${BASE_TAG}" >&2
            exit 1
          fi

          if git ls-remote \
            --exit-code \
            --heads origin \
            "release/${RELEASE_NAME}" >/dev/null 2>&1
          then
            echo \
              "Release branch already exists: release/${RELEASE_NAME}" >&2
            exit 1
          fi

          if git ls-remote \
            --exit-code \
            --tags origin \
            "refs/tags/${RELEASE_NAME}" >/dev/null 2>&1
          then
            echo "Release tag already exists: ${RELEASE_NAME}" >&2
            exit 1
          fi

      - name: Configure git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release branch from production tag
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          BASE_TAG: ${{ inputs.base_tag }}
        run: |
          set -euo pipefail

          git checkout "refs/tags/${BASE_TAG}"
          git checkout -b "release/${RELEASE_NAME}"

      - name: Find PRs marked for next release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh pr list \
            --state merged \
            --label "release:next" \
            --base main \
            --limit 100 \
            --json number,title,mergeCommit,mergedAt \
            --jq '
              sort_by(.mergedAt)[]
              | [.number, .mergeCommit.oid, .title]
              | @tsv
            ' \
            > prs.txt

          echo "PRs selected for release:"
          cat prs.txt

          if [[ ! -s prs.txt ]]; then
            echo \
              "No merged PRs found with label release:next" >&2
            exit 1
          fi

      - name: Cherry-pick selected PRs
        shell: bash
        run: |
          set -euo pipefail

          while IFS=$'\t' read -r pr sha title
          do
            echo "Cherry-picking PR #${pr}: ${title} (${sha})"
            git cherry-pick "${sha}"
          done < prs.txt

      - name: Push release branch
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail

          git push origin "release/${RELEASE_NAME}"

      - name: Mark selected PRs for this release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail

          RELEASE_LABEL="release:${RELEASE_NAME}"

          if ! gh label list \
            --limit 1000 \
            --json name \
            --jq '.[].name' |
            grep -Fxq "${RELEASE_LABEL}"
          then
            echo "Creating label ${RELEASE_LABEL}"

            gh label create "${RELEASE_LABEL}" \
              --color "1D76DB" \
              --description "Included in release ${RELEASE_NAME}"
          fi

          while IFS=$'\t' read -r pr sha title
          do
            echo "Changing labels on PR #${pr}: ${title}"

            gh pr edit "${pr}" \
              --remove-label "release:next" \
              --add-label "${RELEASE_LABEL}"
          done < prs.txt
