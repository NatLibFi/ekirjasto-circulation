name: Build Base Image

on:
  schedule:
    - cron: '22 10 * * 1'
  workflow_dispatch:

concurrency:
  group: build-base-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Base image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare build settings
        id: settings
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "repository=ghcr.io/${REPOSITORY_OWNER,,}/ekirjasto-circ-baseimage"
            echo "week=$(date -u +%G%V)"
          } >> "$GITHUB_OUTPUT"
      - name: Build native base image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.baseimage
          target: baseimage
          platforms: linux/${{ matrix.arch }}
          build-args: OS_REFRESH=${{ steps.settings.outputs.week }}
          pull: true
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          cache-to: type=gha,scope=base-${{ matrix.arch }},mode=max
          tags: ${{ steps.settings.outputs.repository }}:ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          push: true
      - name: Record base digest
        env:
          REPOSITORY: ${{ steps.settings.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p base-digests
          printf '%s@%s\n' "$REPOSITORY" "$DIGEST" > "base-digests/$ARCH.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: base-digest-${{ matrix.arch }}
          path: base-digests/*.txt
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: base-digest-*
          path: base-digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture base image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IS_DEFAULT_BRANCH: ${{ github.ref_name == github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${REPOSITORY_OWNER,,}/ekirjasto-circ-baseimage"
          tags=(--tag "${repository}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          if [[ "$IS_DEFAULT_BRANCH" == "true" ]]; then
            tags+=(--tag "${repository}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$(cat base-digests/amd64.txt)" "$(cat base-digests/arm64.txt)"
